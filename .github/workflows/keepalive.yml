name: Keepalive
# GitHub отключает расписание в публичном репо после 60 дней без коммитов.
# Раз в месяц коммитим дату в heartbeat.txt – расписание фида не отключится.
on:
  schedule:
    - cron: '0 6 1 * *'   # 1-го числа каждого месяца
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "keepalive"
          git push
